services:

  redis:
    image: redis:7-alpine
    container_name: whoop_redis
    restart: unless-stopped
    ports:
      - "6380:6379"          # host:container — avoids conflict with local Redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data      # persist stream data across restarts

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: whoop_clickhouse
    restart: unless-stopped
    ports:
      - "9000:9000"    # native TCP client
      - "8123:8123"    # HTTP interface
    environment:
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: whoop_ingest
    restart: unless-stopped
    ports:
      - "100.127.237.13:9001:9001"  # Tailscale only — not reachable from public internet
    environment:
      REDIS_URL: redis://redis:6379        # internal Docker network — always 6379 here
      CLICKHOUSE_URL: http://clickhouse:8123  # internal HTTP interface
      API_KEY: ${API_KEY}                  # sourced from .env
    depends_on:
      redis:
        condition: service_healthy         # wait for Redis to pass its healthcheck
      clickhouse:
        condition: service_healthy         # wait for ClickHouse to pass its healthcheck

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: whoop_worker
    restart: unless-stopped
    environment:
      REDIS_URL:           redis://redis:6379   # internal Docker network
      REDIS_STREAM:        whoop_raw_stream
      CLICKHOUSE_HOST:     clickhouse
      CLICKHOUSE_PORT:     9000                 # binary TCP — used by clickhouse-cpp
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  redis_data:
  clickhouse_data:
