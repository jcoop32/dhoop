<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whoop BLE Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #09090b; /* Zinc dark palette from previous NBA watcher projects */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 700;
            margin-bottom: 15px;
            color: #fafafa;
            letter-spacing: -0.05em;
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            text-align: center;
        }
        .status-live {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .status-offline {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
        .battery-badge {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
            margin-left: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.05);
            color: #a1a1aa;
        }
        .battery-high  { color: #10b981; border-color: rgba(16, 185, 129, 0.4); background-color: rgba(16, 185, 129, 0.1); }
        .battery-mid   { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); background-color: rgba(245, 158, 11, 0.1); }
        .battery-low   { color: #ef4444; border-color: rgba(239, 68, 68, 0.4);  background-color: rgba(239, 68, 68, 0.1);  }
        .charts-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .chart-box {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        canvas {
            width: 100% !important;
            max-height: 350px;
        }
        .metric-display {
            margin-bottom: 12px;
            line-height: 1;
        }
        #currentHrValue {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            letter-spacing: -0.03em;
        }
        .metric-unit {
            font-size: 1.2rem;
            font-weight: 600;
            color: #a1a1aa;
            vertical-align: middle;
        }
        #currentTempValue {
            font-size: 3.5rem;
            font-weight: 800;
            color: #f97316;  /* orange — distinct from HR red */
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
            letter-spacing: -0.03em;
        }
        .raw-feed-section {
            width: 100%;
            max-width: 1200px;
            margin-top: 30px;
        }
        .raw-feed-container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }
        table.raw-table {
            width: 100%;
            border-collapse: collapse;
        }
        table.raw-table th, table.raw-table td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        table.raw-table th {
            color: #a1a1aa;
            font-weight: 600;
            position: sticky;
            top: -16px; /* Offset padding */
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
        }
        table.raw-table td {
            color: #10b981; /* terminal green */
        }
        table.raw-table td.ts-col {
            color: #60a5fa; /* timestamp blue */
            white-space: nowrap;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Live Telemetry</h1>
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:0;">
        <div id="statusBadge" class="status-badge status-offline">iPhone Link: OFFLINE (Checking...)</div>
        <div id="batteryBadge" class="battery-badge">🔋 --</div>
    </div>
    <div class="charts-container">
        <div class="chart-box">
            <div class="metric-display">
                <span id="currentHrValue">--</span>
                <span class="metric-unit">BPM</span>
            </div>
            <canvas id="hrChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="accelChart"></canvas>
        </div>
        <div class="chart-box">
            <div class="metric-display">
                <span id="currentTempValue">--</span>
                <span class="metric-unit">&deg;C</span>
            </div>
            <canvas id="skinTempChart"></canvas>
        </div>
    </div>
    
    <div class="raw-feed-section">
        <h2 style="font-weight: 600; margin-bottom: 15px; color: #fafafa;">Live Raw Data Feed</h2>
        <div class="raw-feed-container">
            <table class="raw-table">
                <thead>
                    <tr>
                        <th>Timestamp (Local)</th>
                        <th>Raw Hex Payload</th>
                    </tr>
                </thead>
                <tbody id="rawFeedBody">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Set default Chart.js text color for dark theme
        Chart.defaults.color = '#a1a1aa';
        Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Initialize Heart Rate Chart
        const hrCtx = document.getElementById('hrChart').getContext('2d');
        const hrChart = new Chart(hrCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Heart Rate (bpm)',
                    data: [],
                    borderColor: '#ef4444', // Red-500
                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 }, // Disable animation for live scrolling effect
                scales: {
                    x: { display: false },
                    y: {
                        min: 40,
                        max: 200,
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#fafafa', font: { weight: 600 } } }
                }
            }
        });

        // Initialize Accelerometer Chart
        const accelCtx = document.getElementById('accelChart').getContext('2d');
        const accelChart = new Chart(accelCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'X Axis',
                        data: [],
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1
                    },
                    {
                        label: 'Y Axis',
                        data: [],
                        borderColor: '#10b981',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1
                    },
                    {
                        label: 'Z Axis',
                        data: [],
                        borderColor: '#f59e0b',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: { display: false },
                    y: {
                        min: -2.5,
                        max: 2.5,
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#fafafa', font: { weight: 600 } } }
                }
            }
        });

        // Initialize Skin Temperature Chart
        const skinTempCtx = document.getElementById('skinTempChart').getContext('2d');
        const skinTempChart = new Chart(skinTempCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Skin Temp (°C)',
                    data: [],
                    borderColor: '#f97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.08)',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: { display: false },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { callback: v => v.toFixed(1) + '°C' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#fafafa', font: { weight: 600 } } }
                }
            }
        });

        async function updateCharts() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();
                
                // Reverse the descending arrays back into chronological (ASC) order for left-to-right rendering
                const hrData = data.hr.reverse();
                const accelData = data.accelerometer.reverse();

                // Update HR
                if (hrData.length > 0) {
                    const latestHr = hrData[hrData.length - 1].heart_rate;
                    document.getElementById('currentHrValue').textContent = latestHr;
                }
                hrChart.data.labels = hrData.map(d => d.timestamp);
                hrChart.data.datasets[0].data = hrData.map(d => d.heart_rate);
                hrChart.update();

                // Update Accelerometer
                accelChart.data.labels = accelData.map(d => d.timestamp);
                accelChart.data.datasets[0].data = accelData.map(d => d.accel_x);
                accelChart.data.datasets[1].data = accelData.map(d => d.accel_y);
                accelChart.data.datasets[2].data = accelData.map(d => d.accel_z);
                accelChart.update();

                // Update Skin Temperature
                const skinTempData = (data.skin_temp || []).slice().reverse();
                if (skinTempData.length > 0) {
                    const latestTemp = parseFloat(skinTempData[skinTempData.length - 1].temp_c).toFixed(1);
                    document.getElementById('currentTempValue').textContent = latestTemp;
                }
                skinTempChart.data.labels = skinTempData.map(d => d.timestamp);
                skinTempChart.data.datasets[0].data = skinTempData.map(d => parseFloat(d.temp_c));
                skinTempChart.update();

                // Update Raw Feed
                const rawBody = document.getElementById('rawFeedBody');
                rawBody.innerHTML = ''; // Clear current rows
                const rawData = data.raw || [];
                // rawData is descending from API, so no need to reverse if we want newest on top
                rawData.forEach(record => {
                    const row = document.createElement('tr');
                    const tsTd = document.createElement('td');
                    tsTd.className = 'ts-col';
                    // Parse timestamp to local readable string
                    const localDate = new Date(record.timestamp + 'Z'); // Add Z to specify UTC
                    tsTd.textContent = localDate.toLocaleTimeString() + '.' + String(localDate.getMilliseconds()).padStart(3, '0');
                    
                    const hexTd = document.createElement('td');
                    hexTd.textContent = record.hex_data;
                    
                    row.appendChild(tsTd);
                    row.appendChild(hexTd);
                    rawBody.appendChild(row);
                });
                
            } catch (error) {
                console.error("Error fetching latest data:", error);
            }
        }

        // Fetch every 500ms
        setInterval(updateCharts, 500);
        updateCharts(); // Initial fetch

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const badge = document.getElementById('statusBadge');
                const battBadge = document.getElementById('batteryBadge');
                if (data.connected) {
                    badge.className = 'status-badge status-live';
                    badge.textContent = 'iPhone Link: LIVE';
                } else {
                    badge.className = 'status-badge status-offline';
                    const secText = data.last_seen_seconds_ago !== null ? data.last_seen_seconds_ago + ' sec ago' : 'Never seen';
                    badge.textContent = `iPhone Link: OFFLINE (Last seen ${secText})`;
                }
                // Battery badge
                if (data.battery_level !== null && data.battery_level !== undefined) {
                    const pct = data.battery_level;
                    let icon = pct > 50 ? '🔋' : pct > 20 ? '🪫' : '🔴';
                    let cls  = pct > 50 ? 'battery-high' : pct > 20 ? 'battery-mid' : 'battery-low';
                    battBadge.className = `battery-badge ${cls}`;
                    battBadge.textContent = `${icon} ${pct}%`;
                } else {
                    battBadge.className = 'battery-badge';
                    battBadge.textContent = '🔋 --';
                }
            } catch (error) {
                console.error("Error fetching status:", error);
                const badge = document.getElementById('statusBadge');
                badge.className = 'status-badge status-offline';
                badge.textContent = 'iPhone Link: OFFLINE (Error connecting)';
            }
        }

        setInterval(updateStatus, 1000);
        updateStatus(); // Initial fetch
    </script>
</body>
</html>
